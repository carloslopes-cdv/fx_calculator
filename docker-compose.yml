services:
  postgres-db:
    image: postgres:16-alpine
    container_name: fx_simulator_db
    restart: always
    environment:
      POSTGRES_USER: fx_admin
      POSTGRES_PASSWORD: fx_secure_password123
      POSTGRES_DB: fx_simulator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fx_admin -d fx_simulator"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
